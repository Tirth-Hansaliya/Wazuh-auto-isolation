  <!-- ===================== CLAMAV MALWARE SCANNING ===================== -->

  <!-- Collect malware scan logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/wazuh-av.log</location>
  </localfile>

  <!-- Scan recently changed files every 5 minutes -->
  <wodle name="command">
    <disabled>no</disabled>
    <tag>av-recent</tag>
    <command>/var/ossec/active-response/bin/wazuh-av-scan.sh recent</command>
    <interval>5m</interval>
    <run_on_start>yes</run_on_start>
    <ignore_output>yes</ignore_output>
    <timeout>900</timeout>
  </wodle>

  <!-- Full filesystem scan every 7 days -->
  <wodle name="command">
    <disabled>no</disabled>
    <tag>av-full</tag>
    <command>/var/ossec/active-response/bin/wazuh-av-scan.sh full</command>
    <interval>7d</interval>
    <run_on_start>no</run_on_start>
    <ignore_output>yes</ignore_output>
    <timeout>0</timeout>
  </wodle>

  <!-- ===================== UFW FIREWALL MONITORING ===================== -->

  <!-- Collect UFW configuration status every 60 seconds -->
  <localfile>
    <log_format>command</log_format>
    <alias>ufw-state</alias>
    <command>grep ^ENABLED= /etc/ufw/ufw.conf</command>
    <frequency>60</frequency>
  </localfile>

  <!-- ===================== ADDITIONAL LOG COLLECTION ===================== -->

  <!-- System journal -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <!-- Active-response logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <!-- Package management logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

  <!-- ===================== END CUSTOM CONFIGURATION ===================== -->