<!-- /var/ossec/etc/shared/default/agent.conf  (centralized, pushed to every agent in group "default")
     System-wide detection is done by the antivirus engines (Defender / ClamAV).
     FIM below only feeds the optional VirusTotal layer and gives an audit trail.
     Real-time FIM on "/" or "C:\" is not practical (inotify limits, I/O load, VT quota),
     so FIM watches the places malware actually lands. -->

<agent_config os="Windows">
  <syscheck>
    <directories realtime="yes">C:\Users\*\Downloads</directories>
    <directories realtime="yes">C:\Users\*\AppData\Local\Temp</directories>
    <directories realtime="yes">C:\Users\*\AppData\Roaming</directories>
    <directories realtime="yes">C:\Users\Public</directories>
    <directories realtime="yes">C:\Windows\Temp</directories>
    <directories realtime="yes">C:\ProgramData</directories>
    <directories realtime="yes">C:\Temp</directories>
  </syscheck>
</agent_config>

<agent_config os="Linux">
  <syscheck>
    <directories realtime="yes">/tmp,/var/tmp,/dev/shm</directories>
    <directories realtime="yes">/home,/root</directories>
    <directories realtime="yes">/opt,/srv,/var/www</directories>
    <directories realtime="yes">/usr/local/bin,/usr/local/sbin</directories>
    <ignore type="sregex">/\.cache/|/node_modules/|/snap/|/\.mozilla/|/\.config/|/\.local/share/|/\.thumbnails/</ignore>
  </syscheck>
</agent_config>

<agent_config os="Darwin">
  <syscheck>
    <!-- scheduled (not real-time) scans on macOS -->
    <frequency>600</frequency>
    <directories>/Users</directories>
    <directories>/private/tmp,/private/var/tmp</directories>
    <directories>/Applications</directories>
    <directories>/Library/LaunchAgents,/Library/LaunchDaemons</directories>
    <directories>/usr/local/bin</directories>
    <ignore type="sregex">/Library/Caches/|/\.cache/</ignore>
  </syscheck>
</agent_config>
